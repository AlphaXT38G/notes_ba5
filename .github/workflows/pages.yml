name: Publish notes

on:
  push:
    branches: [main]
  # Daily rebuild: the "New" badges are computed at build time, so without a push they would
  # never expire. 04:00 UTC = 05:00/06:00 in Lausanne. GitHub pauses scheduled workflows after
  # 60 days without activity on the repository.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # The build and the deploy are the engine's, always from its main (the same ref in the workflow, twice, and in requirements.txt).
    # When the semester ends, replace main by a tag in both (see AGENTS.md).
    uses: AlphaXT38G/notes-engine/.github/workflows/pages.yml@main
    with:
      engine-ref: main
