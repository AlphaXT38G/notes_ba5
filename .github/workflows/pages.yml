name: Publish notes

on:
  push:
    branches: [main]
  # Daily rebuild: the "New" badges are computed at build time, so without a push they would
  # never expire. 04:00 UTC = 05:00/06:00 in Lausanne. GitHub pauses scheduled workflows after
  # 60 days without activity on the repository.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: document dates come from git log

      # poppler-utils provides pdftoppm, used for the first-page previews
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk lmodern texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-science texlive-lang-french poppler-utils

      # Publish whatever compiled; failed documents are reported but do not block the deploy.
      - name: Build PDFs and index
        run: python3 build.py
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
