name: Publish notes

on:
  push:
    branches: [main]
  # Daily rebuild: the "New" badges are computed at build time, so without a push they would
  # never expire. 04:00 UTC = 05:00/06:00 in Lausanne. GitHub pauses scheduled workflows after
  # 60 days without activity on the repository.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # The build and the deploy are the engine's: the same tag is pinned twice (workflow and engine)
    # and in requirements.txt.
    uses: AlphaXT38G/notes-engine/.github/workflows/pages.yml@v0.1.0
    with:
      engine-ref: v0.1.0
