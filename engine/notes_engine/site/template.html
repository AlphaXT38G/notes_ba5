<!doctype html>
<html lang="en" data-short="{{short}}"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<script>{{head_js}}</script>
<style>{{css}}</style></head><body><div class="wrap">
<header><div class="tools"><button id="fire" type="button" aria-label="Flame mode" title="Flame mode" aria-pressed="false">🔥</button><button id="theme" type="button" aria-label="Toggle dark mode">◐</button></div>
<h1>{{title}}</h1><p class="sub">{{subtitle}}</p>
<form class="searchrow" role="search" action="#"><input id="search" type="search" placeholder="Search a course, a week, a word…" aria-label="Search documents" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
<div class="view" role="group" aria-label="Display"><button type="button" data-view="names" aria-pressed="true">Names</button><button type="button" data-view="previews" aria-pressed="false">Previews</button></div></form></header>
<main class="grid"><div class="col">{{cards_left}}</div><div class="col">{{cards_right}}</div></main>
<p id="empty" hidden>No document matches this search.</p>
<footer>Generated {{generated}} by notes-engine</footer>
</div>{{js}}</body></html>
