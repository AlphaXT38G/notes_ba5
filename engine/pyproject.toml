[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-engine"
version = "0.1.0"
description = "Compile LaTeX course notes to PDF and publish them behind a searchable, playful index page."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []  # the standard library only; latexmk, poppler and node are optional tools

[project.scripts]
notes-engine = "notes_engine.cli:main"

[tool.setuptools]
packages = ["notes_engine"]

[tool.setuptools.package-data]
notes_engine = ["site/**/*", "shared/*"]
